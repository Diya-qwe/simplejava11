
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simplejava11
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simplejava11
  template:
    metadata:
      labels:
        app: simplejava11
    spec:
      containers:
        - name: java-app
          image: diyasree/simplejava11:latest
          imagePullPolicy: Always
